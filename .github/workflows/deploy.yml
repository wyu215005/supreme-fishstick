name: 部署到 GitHub Pages

on:
  push:
    branches: ["main"]
  # 允许在 GitHub Actions UI 手动触发
  workflow_dispatch:

# 设置权限，允许 Actions 部署到 Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 只允许一次并发部署，跳过排队中的运行
# 但不取消正在进行的运行，避免破坏生产部署
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          # 部署仓库根目录
          path: "."

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
