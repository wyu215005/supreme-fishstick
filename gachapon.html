        </header>
    </main>

    <div class="gachapon-page-container">
        <!-- 扭蛋机 -->
        <div class="gachapon-machine-v3" id="machineBody">
            <div class="machine-header">
                <span class="machine-brand">FISHRAIN</span>
                <div class="machine-lights">
                    <span class="machine-light" id="lightRed"></span>
                    <span class="machine-light" id="lightYellow"></span>
                    <span class="machine-light" id="lightGreen"></span>
                </div>
            </div>
            <div class="glass-dome" id="dome"></div>
            <div class="machine-control">
                <div class="machine-display" id="displayText">&#9679; READY</div>
                <div class="spin-progress-wrap">
                    <svg class="spin-progress-svg" id="spinProgressSvg" viewBox="0 0 100 100" aria-hidden="true">
                        <circle class="spin-progress-circle" id="spinProgressCircle" cx="50" cy="50" r="45"></circle>
                    </svg>
                    <div class="knob-v3" id="spinBtn" role="button" tabindex="0" aria-label="转动旋钮抽奖" data-i18n-attr="aria-label:gachapon.spinAria">
                        <div class="knob-line"></div>
                    </div>
                </div>
            </div>
            <div class="machine-tray">
                <div class="tray-label">TAKE OUT</div>
                <div class="tray-opening" id="trayOpening"></div>
            </div>
        </div>

        <!-- 菜单管理 -->
        <div class="dish-manager">
            <h3 style="font-size: 1.2rem; margin-bottom: 0.4rem;" data-i18n="gachapon.menuTitle">菜单管理</h3>
            <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1.2rem;" data-i18n="gachapon.menuNote">
                扭蛋里装什么你说了算 —— 添加你纠结的选项，数据保存在浏览器本地。
            </p>
            <div style="display: flex; gap: 0.6rem; flex-wrap: wrap;">
                <input type="text" id="dishInput" class="form-input" style="flex: 1; min-width: 180px; margin: 0;" placeholder="输入一个选项，例如：螺蛳粉 🍜" aria-label="添加选项" data-i18n-attr="placeholder:gachapon.addPh;aria-label:gachapon.addAria">
                <button class="btn btn-primary" id="addBtn" style="white-space: nowrap;" data-i18n="gachapon.addBtn">添加</button>
            </div>
            <div class="dish-grid" id="dishList"></div>
            <button id="resetBtn" class="btn" style="margin-top: 1.2rem; width: 100%; color: var(--text-muted);" data-i18n="gachapon.resetBtn">&#x1F504; 恢复默认菜单</button>
        </div>
