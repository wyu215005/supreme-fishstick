<!DOCTYPE html>
<html lang="zh-CN" data-theme="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="FishRain 扭蛋机 —— 今天吃什么？让随机来决定！">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta http-equiv="X-Frame-Options" content="SAMEORIGIN">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';">
    <meta property="og:title" content="扭蛋机 - FishRain">
    <meta property="og:description" content="今天吃什么？让扭蛋机来决定！">
    <meta property="og:type" content="website">
    <title>美食大放送 - FishRain</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/pixel.css">
</head>
<body>
    <!-- 像素风彩虹顶部横幅 -->
    <div class="pixel-banner" aria-hidden="true">
        ★ FISHRAIN PIXEL WORLD ★ 欢迎来到像素世界 ★ FISHRAIN PIXEL WORLD ★
    </div>

    <!-- 导航栏 -->
    <nav class="navbar" role="navigation" aria-label="主导航">
        <div class="nav-container">
            <div class="nav-logo">
                <a href="index.html">🐟 FishRain</a>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link">首页</a></li>
                <li><a href="articles.html" class="nav-link">文章</a></li>
                <li><a href="about.html" class="nav-link">关于我</a></li>
                <li><a href="gachapon.html" class="nav-link active">扭蛋机</a></li>
                <li><a href="guestbook.html" class="nav-link">留言板</a></li>
            </ul>
            <div class="nav-controls">
                <button class="dark-mode-toggle" aria-label="切换暗黑模式">🌙</button>
                <button class="nav-toggle" aria-label="切换导航菜单" aria-expanded="false">
                    <span class="bar"></span>
                    <span class="bar"></span>
                    <span class="bar"></span>
                </button>
            </div>
        </div>
    </nav>

    <!-- 主容器 -->
    <div class="container">
        <h1 style="text-align: center; margin-bottom: 30px; font-size: 1.8rem; font-weight: 700; letter-spacing: -0.02em;">🎰 今天吃什么？</h1>

        <div class="gachapon-page-container">
            <!-- 扭蛋机 -->
            <div class="gachapon-machine-v3" id="machineBody">
                <!-- 顶部品牌栏 + 指示灯 -->
                <div class="machine-header">
                    <div class="machine-brand">🎰 GACHAPON</div>
                    <div class="machine-lights">
                        <span class="machine-light lit-red" id="lightRed"></span>
                        <span class="machine-light lit-yellow" id="lightYellow"></span>
                        <span class="machine-light lit-green" id="lightGreen"></span>
                    </div>
                </div>

                <!-- 玻璃罩 -->
                <div class="glass-dome" id="dome"></div>

                <!-- 控制面板 -->
                <div class="machine-control">
                    <!-- 状态显示屏 -->
                    <div class="machine-display" id="machineDisplay">
                        <span id="displayText">● READY</span>
                    </div>

                    <!-- 旋钮（带进度圆环） -->
                    <div class="spin-progress-wrap">
                        <div class="knob-v3" id="spinBtn" role="button" tabindex="0" aria-label="转动扭蛋机">
                            <div class="knob-line"></div>
                        </div>
                        <svg class="spin-progress-svg" id="spinProgressSvg" viewBox="0 0 100 100">
                            <circle class="spin-progress-circle" id="spinProgressCircle" cx="50" cy="50" r="45"/>
                        </svg>
                    </div>

                    <p style="color: var(--gold); font-weight: 800; font-size: 0.72rem; letter-spacing: 3px; margin-top: 4px; text-shadow: 0 0 8px rgba(255,209,102,0.5);">SPIN TO DECIDE</p>
                </div>

                <!-- 出球托盘 -->
                <div class="machine-tray">
                    <div class="tray-label">OUTPUT</div>
                    <div class="tray-opening" id="trayOpening"></div>
                </div>
            </div>

            <!-- 菜品管理面板 -->
            <div class="dish-manager">
                <h2 style="font-size: 1.1rem; margin-bottom: 18px; font-weight: 700; letter-spacing: -0.01em;">📋 菜品库管理</h2>
                <div style="display: flex; gap: 8px; margin-bottom: 1.25rem;">
                    <input type="text" id="dishInput" placeholder="输入新菜品名称..."
                        maxlength="20"
                        style="flex:1; padding:10px 14px; border-radius:8px; border:1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); font-size: 0.9rem; outline: none; transition: border-color 0.2s, box-shadow 0.2s;"
                        aria-label="菜品名称">
                    <button class="btn" id="addBtn" style="padding: 0 18px; font-size: 0.85rem;">添加</button>
                </div>

                <div id="dishList" class="dish-grid"></div>

                <button id="resetBtn" style="margin-top: 24px; width: 100%; background: none; border: 1px dashed var(--border-color); padding: 10px; cursor: pointer; color: var(--text-muted); border-radius: 8px; font-size: 0.85rem; transition: all 0.2s;">恢复系统默认菜单</button>
            </div>
        </div>
    </div>

    <!-- 结果弹窗 -->
    <div class="result-overlay" id="resultOverlay" role="dialog" aria-modal="true" aria-labelledby="resultDish">
        <div class="result-card" id="resultCard">
            <p class="result-label">🎉 今天就吃这个了！</p>
            <div class="result-dish" id="resultDish">---</div>
            <button class="btn" id="closeResultBtn" style="padding: 12px 40px; border-radius: 30px;">太棒了！开吃！</button>
        </div>
    </div>

    <!-- 页脚 -->
    <footer class="footer">
        <div class="footer-content">
            <p>&copy; 2026 FishRain. 记录学习，分享成长。</p>
        </div>
    </footer>

    <script src="js/config.js" defer></script>
    <script src="js/navbar.js" defer></script>
    <script src="js/gachapon.js" defer></script>
    <script src="js/pixel-effects.js" defer></script>

    <!-- 像素艺术浮动装饰层 -->
    <div class="pixel-layer" aria-hidden="true">
        <div class="pixel-sprite pixel-mushroom-1"></div>
        <div class="pixel-sprite pixel-mushroom-2"></div>
        <div class="pixel-sprite pixel-fish-1"></div>
        <div class="pixel-sprite pixel-fish-2"></div>
        <div class="pixel-sprite pixel-star-1"></div>
        <div class="pixel-sprite pixel-star-2"></div>
        <div class="pixel-sprite pixel-star-3"></div>
        <div class="pixel-sprite pixel-cloud-1"></div>
        <div class="pixel-sprite pixel-cloud-2"></div>
    </div>
</body>
</html>
