    <main class="guestbook-container">
        <header class="page-header" style="text-align: center; padding-bottom: 0;">
            <h1><span class="icon icon-bottle icon-lg" aria-hidden="true"></span> <span data-i18n="guestbook.title">留言墙</span></h1>
            <p class="page-sub" data-i18n="guestbook.sub">路过就留张便签吧 —— 你的话会被贴在墙上，风吹不走。</p>
        </header>

        <div class="db-status" id="dbStatus" data-state="checking" data-i18n="guestbook.dbChecking">☁️ 云端状态检查中…</div>

        <!-- 留言表单（修复原站表单 ID 与 JS 不匹配导致无法提交的问题） -->
        <form class="message-form card" id="messageForm" style="margin-bottom: 0;">
            <div class="form-group">
                <label class="form-label" for="messageName" data-i18n="guestbook.nameLabel">昵称 *</label>
                <input type="text" id="messageName" class="form-input" maxlength="20" placeholder="怎么称呼你？" required data-i18n-attr="placeholder:guestbook.namePh">
            </div>
            <div class="form-group">
                <label class="form-label" for="messageContent" data-i18n="guestbook.contentLabel">留言内容 *</label>
                <textarea id="messageContent" class="form-textarea" maxlength="200" placeholder="说点什么…（200 字以内）" required data-i18n-attr="placeholder:guestbook.contentPh"></textarea>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;" data-i18n="guestbook.submit">✉️ 贴上便签</button>
        </form>

        <!-- 留言展示 -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin: 2rem 0 1rem;">
            <h2 style="font-size: 1.15rem;" data-i18n="guestbook.wall">便签墙</h2>
        </div>
        <div class="message-list" id="messageList" aria-live="polite"></div>
    </main>
