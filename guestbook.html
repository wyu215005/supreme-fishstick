<!DOCTYPE html>
<html lang="zh-CN" data-theme="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="FishRain 到此一游墙 —— 路过就留个爪印，想说什么都可以！">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta http-equiv="X-Frame-Options" content="SAMEORIGIN">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; script-src 'self' file:; style-src 'self' file: 'unsafe-inline'; img-src 'self' file: data: https:; font-src 'self' file:; connect-src 'self' https://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self';">
    <meta property="og:title" content="到此一游墙 - FishRain">
    <meta property="og:description" content="路过就留个爪印，想说什么都可以！">
    <meta property="og:type" content="website">
    <title>到此一游墙 - FishRain</title>
    <link rel="icon" type="image/svg+xml" href="images/pixel-fish.svg">
    <script src="js/theme-init.js"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/pixel.css">
</head>
<body>
    <!-- 像素风彩虹顶部横幅 -->
    <div class="pixel-banner" aria-hidden="true">
        ★ FISHRAIN PIXEL WORLD ★ 欢迎来到像素世界 ★ FISHRAIN PIXEL WORLD ★
    </div>

    <!-- 导航栏 -->
    <nav class="navbar" role="navigation" aria-label="主导航">
        <div class="nav-container">
            <div class="nav-logo">
                <a href="index.html">🐟 FishRain</a>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link">首页</a></li>
                <li><a href="articles.html" class="nav-link">文章</a></li>
                <li><a href="about.html" class="nav-link">关于我</a></li>
                <li><a href="gachapon.html" class="nav-link">扭蛋机</a></li>
                <li><a href="guestbook.html" class="nav-link active">留言板</a></li>
            </ul>
            <div class="nav-controls">
                <button class="dark-mode-toggle" aria-label="切换暗黑模式">🌙</button>
                <button class="nav-toggle" aria-label="切换导航菜单" aria-expanded="false">
                    <span class="bar"></span>
                    <span class="bar"></span>
                    <span class="bar"></span>
                </button>
            </div>
        </div>
    </nav>

    <!-- 主容器 -->
    <div class="container">
        <h1 style="text-align: center; margin: 2rem 0; font-size: 2rem; font-weight: 600;">📍 到此一游墙</h1>
        <p style="text-align: center; color: var(--text-secondary); margin-bottom: 2rem; font-size: 0.95rem;">
            路过就留个爪印吧！想说啥都行，每一条我都会认真看～
        </p>

        <div class="guestbook-container">
            <!-- 留言表单 -->
            <form id="messageForm" class="message-form card" novalidate>
                <div class="form-group">
                    <label for="messageName" class="form-label">你是谁呀</label>
                    <input type="text" id="messageName" class="form-input"
                        placeholder="叫你什么好呢～（最多 20 字）"
                        maxlength="20" required autocomplete="nickname">
                </div>
                <div class="form-group">
                    <label for="messageContent" class="form-label">想说的话</label>
                    <textarea id="messageContent" class="form-textarea"
                        placeholder="随便聊聊：夸夸我、提提建议、打个招呼都行～（最多 300 字）"
                        maxlength="300" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">到此一游 🐾</button>
            </form>

            <!-- 数据库连接状态 -->
            <div id="dbStatus" class="db-status" role="status" aria-live="polite">🚪 正在开门…</div>

            <!-- 留言列表 -->
            <div id="messageList" class="message-list" role="feed" aria-label="到此一游爪印列表">
                <!-- 留言将通过 JavaScript 动态生成 -->
            </div>
        </div>
    </div>

    <!-- 页脚 -->
    <footer class="footer">
        <div class="footer-content">
            <p>&copy; 2026 FishRain. 记录学习，分享成长。</p>
        </div>
    </footer>

    <script src="js/config.js" defer></script>
    <script src="js/navbar.js" defer></script>
    <script src="js/guestbook.js" defer></script>
    <script src="js/pixel-effects.js" defer></script>

    <!-- 像素艺术浮动装饰层 -->
    <div class="pixel-layer" aria-hidden="true">
        <div class="pixel-sprite pixel-mushroom-1"></div>
        <div class="pixel-sprite pixel-mushroom-2"></div>
        <div class="pixel-sprite pixel-fish-1"></div>
        <div class="pixel-sprite pixel-fish-2"></div>
        <div class="pixel-sprite pixel-star-1"></div>
        <div class="pixel-sprite pixel-star-2"></div>
        <div class="pixel-sprite pixel-star-3"></div>
        <div class="pixel-sprite pixel-cloud-1"></div>
        <div class="pixel-sprite pixel-cloud-2"></div>
    </div>
</body>
</html>
