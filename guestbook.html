<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>留言板 - FishRain</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <a href="index.html">🐟 FishRain</a>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link">首页</a></li>
                <li><a href="articles.html" class="nav-link">文章</a></li>
                <li><a href="about.html" class="nav-link">关于我</a></li>
                <li><a href="gachapon.html" class="nav-link">扭蛋机</a></li>
                <li><a href="guestbook.html" class="nav-link active">留言板</a></li>
            </ul>
        </div>
    </nav>

    <!-- 主容器 -->
    <div class="container">
        <h1 style="text-align: center; margin: 2rem 0; font-size: 2rem; font-weight: 600;">💬 留言板</h1>
        <p style="text-align: center; color: var(--text-secondary); margin-bottom: 2rem; font-size: 0.95rem;">
            欢迎留下你的想法、建议或问题，我会认真阅读每一条留言！
        </p>

        <div class="guestbook-container">
            <!-- 留言表单 -->
            <form id="messageForm" class="message-form card">
                <div class="form-group">
                    <label for="messageName" class="form-label">你的名字</label>
                    <input type="text" id="messageName" class="form-input" placeholder="请输入你的名字" required>
                </div>
                <div class="form-group">
                    <label for="messageContent" class="form-label">留言内容</label>
                    <textarea id="messageContent" class="form-textarea" placeholder="写下你想说的话..." required></textarea>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">提交留言</button>
            </form>

            <!-- 留言列表 -->
            <div id="messageList" class="message-list">
                <!-- 留言将通过JavaScript动态生成 -->
            </div>
        </div>
    </div>

    <!-- 页脚 -->
    <footer class="footer">
        <div class="footer-content">
            <p>&copy; 2026 FishRain. 记录学习，分享成长。</p>
        </div>
    </footer>

    <script src="js/config.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/guestbook.js"></script>
</body>
</html>
