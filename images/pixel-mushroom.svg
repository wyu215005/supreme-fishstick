<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" shape-rendering="crispEdges" viewBox="0 0 32 32">
  <!-- Red mushroom cap -->
  <rect x="10" y="0" width="12" height="2" fill="#e74c3c"/>
  <rect x="8" y="2" width="16" height="2" fill="#e74c3c"/>
  <rect x="6" y="4" width="20" height="2" fill="#e74c3c"/>
  <rect x="4" y="6" width="24" height="2" fill="#e74c3c"/>
  <!-- White spots on cap -->
  <rect x="6" y="6" width="4" height="4" fill="#ffffff"/>
  <rect x="18" y="4" width="4" height="4" fill="#ffffff"/>
  <!-- Wider cap rows -->
  <rect x="2" y="8" width="28" height="2" fill="#e74c3c"/>
  <rect x="2" y="10" width="28" height="2" fill="#e74c3c"/>
  <!-- Dark bottom of cap -->
  <rect x="0" y="12" width="32" height="2" fill="#c0392b"/>
  <rect x="2" y="14" width="28" height="2" fill="#c0392b"/>
  <!-- Stalk -->
  <rect x="10" y="16" width="12" height="6" fill="#f5cba7"/>
  <rect x="12" y="16" width="2" height="6" fill="#e8b89a"/>
  <rect x="18" y="16" width="2" height="6" fill="#e8b89a"/>
  <!-- Base -->
  <rect x="8" y="22" width="16" height="2" fill="#d7b896"/>
  <rect x="6" y="24" width="20" height="2" fill="#a0522d"/>
</svg>