<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" shape-rendering="crispEdges" viewBox="0 0 16 16">
  <!-- FishRain 像素小仔头像 -->
  <rect x="0" y="0" width="16" height="13" fill="#eaf6ff"/>
  <rect x="0" y="13" width="16" height="3" fill="#cfe9fb"/>
  <!-- 气泡 -->
  <rect x="4" y="2" width="1" height="1" fill="#ffffff"/>
  <rect x="3" y="3" width="1" height="1" fill="#ffffff"/>
  <rect x="12" y="2" width="1" height="1" fill="#ffffff"/>
  <rect x="13" y="3" width="1" height="1" fill="#ffffff"/>
  <!-- 星星点缀 -->
  <rect x="13" y="4" width="1" height="1" fill="#ffd700"/>
  <rect x="2" y="11" width="1" height="1" fill="#ffd700"/>
  <!-- 尾巴 -->
  <rect x="3" y="6" width="2" height="1" fill="#2980b9"/>
  <rect x="2" y="7" width="2" height="2" fill="#2980b9"/>
  <rect x="3" y="9" width="1" height="1" fill="#2980b9"/>
  <!-- 背鳍 -->
  <rect x="7" y="4" width="4" height="1" fill="#2980b9"/>
  <!-- 身体 -->
  <rect x="6" y="5" width="6" height="1" fill="#5dade2"/>
  <rect x="5" y="6" width="8" height="1" fill="#5dade2"/>
  <rect x="4" y="7" width="10" height="3" fill="#5dade2"/>
  <rect x="5" y="10" width="8" height="1" fill="#aed6f1"/>
  <rect x="6" y="11" width="6" height="1" fill="#aed6f1"/>
  <!-- 高光 -->
  <rect x="6" y="5" width="2" height="1" fill="#d6eaf8"/>
  <rect x="5" y="6" width="1" height="1" fill="#d6eaf8"/>
  <!-- 大眼睛 -->
  <rect x="10" y="6" width="2" height="2" fill="#1b262c"/>
  <rect x="10" y="6" width="1" height="1" fill="#ffffff"/>
  <!-- 腮红 -->
  <rect x="10" y="9" width="1" height="1" fill="#ff9ff3"/>
  <!-- 嘴巴 -->
  <rect x="13" y="8" width="1" height="1" fill="#1b262c"/>
  <!-- 胸鳍 -->
  <rect x="6" y="9" width="2" height="1" fill="#2980b9"/>
  <!-- 沙地小石子 -->
  <rect x="3" y="14" width="1" height="1" fill="#b8dcf5"/>
  <rect x="9" y="15" width="1" height="1" fill="#b8dcf5"/>
  <rect x="13" y="14" width="1" height="1" fill="#b8dcf5"/>
</svg>
