<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a"/>
      <stop offset="100%" style="stop-color:#333333"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="100" fill="url(#bg)"/>
  <!-- 头部轮廓 -->
  <circle cx="100" cy="78" r="32" fill="rgba(255,255,255,0.85)"/>
  <!-- 身体轮廓 -->
  <ellipse cx="100" cy="155" rx="46" ry="38" fill="rgba(255,255,255,0.85)"/>
  <!-- 文字 FR 已移除，使用轮廓表达人物形象 -->
  <text x="100" y="87" font-family="Arial, sans-serif" font-size="26" font-weight="700"
        text-anchor="middle" fill="#1a1a1a" dominant-baseline="middle">FR</text>
</svg>
